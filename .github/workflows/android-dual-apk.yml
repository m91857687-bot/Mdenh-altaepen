name: Android Dual APK Build & Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests across all modules
        run: gradle :core-city:testDebugUnitTest :core-data:testDebugUnitTest :app:testDebugUnitTest :app-admin:testDebugUnitTest --console=plain

      - name: Build Explorer APK (:app)
        run: gradle :app:assembleDebug --console=plain

      - name: Build Admin APK (:app-admin)
        run: gradle :app-admin:assembleDebug --console=plain

      - name: Upload Explorer APK
        uses: actions/upload-artifact@v4
        with:
          name: app-explorer-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: app-admin-debug-apk
          path: app-admin/build/outputs/apk/debug/*.apk
